<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한국어 공간 | Coreano Aesthetic</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-stone-50 text-stone-800 min-h-screen flex flex-col justify-between selection:bg-rose-100 selection:text-rose-700">

    <!-- Header / Barra Superior -->
    <header class="bg-white/80 backdrop-blur-md border-b border-stone-200/60 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <h1 class="text-sm font-semibold tracking-tight text-stone-900">한국어 공간 <span class="text-[10px] text-rose-500 font-medium px-2 py-0.5 bg-rose-50 rounded-full">Aesthetic</span></h1>
        <div id="user-info" class="text-xs text-stone-400"></div>
    </header>

    <!-- Contenedor Principal -->
    <main class="max-w-md mx-auto w-full p-6 flex-1 flex flex-col justify-center">
        
        <!-- Pantalla de Login / Registro -->
        <div id="auth-section" class="bg-white p-8 rounded-3xl shadow-sm border border-stone-100/80">
            <div class="mb-6 text-center">
                <h2 class="text-xl font-bold text-stone-900 mb-1">Bienvenida 🌸</h2>
                <p class="text-xs text-stone-400">Inicia sesión o regístrate para guardar tu progreso de estudio.</p>
            </div>
            
            <div class="space-y-3 mb-6">
                <input type="email" id="email" placeholder="Correo electrónico" class="w-full px-4 py-3 rounded-2xl bg-stone-50 border border-stone-200 text-sm focus:outline-none focus:border-stone-400 transition">
                <input type="password" id="password" placeholder="Contraseña" class="w-full px-4 py-3 rounded-2xl bg-stone-50 border border-stone-200 text-sm focus:outline-none focus:border-stone-400 transition">
            </div>
            
            <div class="space-y-3">
                <button id="btn-login" class="w-full bg-stone-900 text-white py-3 rounded-2xl text-sm font-medium hover:bg-stone-800 active:scale-95 transition-all shadow-sm">Ingresar</button>
                <button id="btn-signup" class="w-full bg-stone-100 text-stone-700 py-3 rounded-2xl text-sm font-medium hover:bg-stone-200 active:scale-95 transition-all">Registrarse</button>
            </div>
        </div>

        <!-- Pantalla Principal de Contenido (Oculta hasta iniciar sesión) -->
        <div id="app-section" class="hidden flex flex-col gap-6">
            
            <!-- Tarjeta de Práctica y Audio -->
            <div class="bg-white p-8 rounded-3xl shadow-sm border border-stone-100 text-center relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-rose-300 to-rose-400"></div>
                <span class="text-[10px] uppercase tracking-widest text-rose-500 font-semibold bg-rose-50 px-3 py-1.5 rounded-full inline-block mb-4">Vocabulario del Día</span>
                
                <p id="palabra-coreano" class="text-5xl font-light text-stone-900 mt-4 mb-3 tracking-wide">안녕하세요</p>
                <p id="palabra-espanol" class="text-sm text-stone-400 mb-8 font-medium">Hola / Buenos días</p>
                
                <div class="flex flex-col gap-3">
                    <button id="btn-audio" class="w-full bg-rose-500 hover:bg-rose-600 text-white py-3.5 rounded-2xl text-sm font-medium active:scale-95 transition-all shadow-sm flex items-center justify-center gap-2">
                        🔊 Escuchar pronunciación
                    </button>
                    <button id="btn-siguiente" class="w-full bg-stone-100 hover:bg-stone-200 text-stone-700 py-3.5 rounded-2xl text-sm font-medium active:scale-95 transition-all">
                        Siguiente palabra ➔
                    </button>
                </div>
            </div>

            <!-- Panel de Control / Sesión -->
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-stone-100 flex justify-between items-center px-6">
                <span class="text-xs text-stone-500">¿Terminaste por hoy?</span>
                <button id="btn-logout" class="text-xs text-rose-500 font-bold hover:underline active:scale-95 transition-all">Cerrar Sesión</button>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="py-6 text-center text-[11px] text-stone-400">
        Práctica de Coreano • Diseñado con estética minimalista ✨
    </footer>

    <!-- Lógica de la App -->
    <script src="app.js"></script>
</body>
</html>
