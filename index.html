<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한국어 공간 | Coreano Aesthetic</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Iconos (Phosphor Icons - minimalistas y bonitos) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            -webkit-tap-highlight-color: transparent; /* Quita el recuadro azul al tocar en móviles */
        }
        
        /* Animaciones y utilidades para el Memorama */
        .perspective { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        
        .card-inner {
            transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
        }
        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }
        
        /* Ocultar scrollbar pero permitir scroll */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-stone-50 text-stone-800 h-screen flex flex-col selection:bg-rose-100 selection:text-rose-700 overflow-hidden">

    <!-- Header / Barra Superior -->
    <header class="bg-white/90 backdrop-blur-md border-b border-stone-200/60 px-6 py-4 flex justify-between items-center z-50 shrink-0">
        <h1 class="text-sm font-bold tracking-tight text-stone-900 flex items-center gap-2">
            한국어 공간 
            <span class="text-[9px] text-rose-500 font-bold px-2 py-0.5 bg-rose-50 rounded-full uppercase tracking-wider">App</span>
        </h1>
        <div class="flex items-center gap-3">
            <!-- Selector de Nivel (Oculto en login) -->
            <select id="level-selector" class="hidden text-xs bg-stone-100 border-none rounded-xl px-3 py-1.5 font-medium text-stone-600 focus:ring-2 focus:ring-rose-200 outline-none cursor-pointer">
                <option value="1">Nivel 1: Básico</option>
                <option value="2">Nivel 2: Intermedio</option>
            </select>
            <div id="user-info" class="text-xs text-stone-400 font-medium"></div>
        </div>
    </header>

    <!-- Área Desplazable Principal -->
    <main class="flex-1 overflow-y-auto no-scrollbar relative flex flex-col">
        <div class="max-w-md mx-auto w-full p-6 flex-1 flex flex-col justify-center pb-24">
            
            <!-- ================= PANTALLA LOGIN ================= -->
            <div id="auth-section" class="bg-white p-8 rounded-[32px] shadow-sm border border-stone-100/80">
                <div class="mb-8 text-center">
                    <div class="w-16 h-16 bg-rose-50 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl">🌸</div>
                    <h2 class="text-2xl font-bold text-stone-900 mb-2">Bienvenida</h2>
                    <p class="text-sm text-stone-500 leading-relaxed">Tu espacio aesthetic para dominar el coreano paso a paso.</p>
                </div>
                
                <div class="space-y-4 mb-8">
                    <div>
                        <label class="text-[10px] uppercase tracking-wider font-bold text-stone-400 ml-1 mb-1 block">Correo</label>
                        <input type="email" id="email" class="w-full px-5 py-4 rounded-2xl bg-stone-50 border-2 border-stone-100 text-sm focus:outline-none focus:border-rose-200 transition-colors">
                    </div>
                    <div>
                        <label class="text-[10px] uppercase tracking-wider font-bold text-stone-400 ml-1 mb-1 block">Contraseña</label>
                        <input type="password" id="password" class="w-full px-5 py-4 rounded-2xl bg-stone-50 border-2 border-stone-100 text-sm focus:outline-none focus:border-rose-200 transition-colors">
                    </div>
                </div>
                
                <div class="space-y-3">
                    <button id="btn-login" class="w-full bg-stone-900 text-white py-4 rounded-2xl text-sm font-semibold hover:bg-stone-800 active:scale-95 transition-all shadow-sm">Iniciar Sesión</button>
                    <button id="btn-signup" class="w-full bg-white text-stone-700 py-4 rounded-2xl text-sm font-semibold border-2 border-stone-100 hover:bg-stone-50 active:scale-95 transition-all">Crear cuenta nueva</button>
                </div>
            </div>

            <!-- ================= CONTENEDOR APP ================= -->
            <div id="app-section" class="hidden flex-col gap-6 w-full h-full">
                
                <!-- 1. SECCIÓN VOCABULARIO (Tarjetas) -->
                <div id="view-vocab" class="app-view flex flex-col gap-6 w-full animate-fade-in">
                    <div class="bg-white p-8 rounded-[32px] shadow-sm border border-stone-100 text-center relative overflow-hidden flex-1 flex flex-col justify-center min-h-[400px]">
                        <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-rose-200 to-rose-400"></div>
                        <span class="text-[10px] uppercase tracking-widest text-rose-500 font-bold bg-rose-50 px-3 py-1.5 rounded-full inline-block mb-6 mx-auto">Flashcard</span>
                        
                        <p id="palabra-coreano" class="text-5xl font-medium text-stone-900 mt-4 mb-4 tracking-wide transition-opacity duration-300">...</p>
                        <p id="palabra-espanol" class="text-base text-stone-500 mb-10 font-medium">...</p>
                        
                        <div class="flex flex-col gap-3 mt-auto">
                            <button onclick="reproducirVoz(document.getElementById('palabra-coreano').innerText)" class="w-full bg-rose-500 text-white py-4 rounded-2xl text-sm font-semibold active:scale-95 transition-all shadow-sm shadow-rose-200 flex items-center justify-center gap-2">
                                <i class="ph-fill ph-speaker-high text-lg"></i> Escuchar pronunciación
                            </button>
                            <button onclick="siguienteVocabulario()" class="w-full bg-stone-100 text-stone-700 py-4 rounded-2xl text-sm font-semibold active:scale-95 transition-all flex items-center justify-center gap-2">
                                Siguiente palabra <i class="ph-bold ph-arrow-right"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 2. SECCIÓN MEMORAMA -->
                <div id="view-memo" class="app-view hidden flex-col gap-4 w-full animate-fade-in">
                    <div class="flex justify-between items-end px-2 mb-2">
                        <div>
                            <h2 class="text-xl font-bold text-stone-900">Memorama</h2>
                            <p class="text-xs text-stone-500">Encuentra los pares (Coreano - Español)</p>
                        </div>
                        <button onclick="iniciarMemorama()" class="text-xs font-bold text-rose-500 bg-rose-50 px-3 py-1.5 rounded-xl active:scale-95 transition-all">Reiniciar</button>
                    </div>
                    
                    <!-- Grid del memorama (Se llena con JS) -->
                    <div id="memo-grid" class="grid grid-cols-3 gap-3 w-full">
                        <!-- Las cartas se inyectan aquí -->
                    </div>
                </div>

                <!-- 3. SECCIÓN LECTURA -->
                <div id="view-lectura" class="app-view hidden flex-col gap-6 w-full animate-fade-in">
                    <h2 class="text-xl font-bold text-stone-900 px-2">Lectura Guiada</h2>
                    
                    <div class="bg-white p-6 rounded-[32px] shadow-sm border border-stone-100 relative">
                        <div class="text-3xl text-rose-200 absolute top-4 left-4"><i class="ph-fill ph-quotes"></i></div>
                        <p id="lectura-coreano" class="text-2xl font-medium text-stone-800 leading-relaxed mt-6 mb-6 text-center px-4">
                            ...
                        </p>
                        
                        <div id="lectura-traduccion" class="hidden text-sm text-stone-500 text-center mb-6 p-4 bg-stone-50 rounded-2xl font-medium">
                            ...
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <button onclick="reproducirVoz(document.getElementById('lectura-coreano').innerText, 0.7)" class="bg-stone-900 text-white py-3 rounded-2xl text-sm font-semibold active:scale-95 transition-all flex flex-col items-center justify-center gap-1">
                                <i class="ph-fill ph-play-circle text-xl"></i> Leer Lento
                            </button>
                            <button onclick="toggleTraduccion()" class="bg-stone-100 text-stone-700 py-3 rounded-2xl text-sm font-semibold active:scale-95 transition-all flex flex-col items-center justify-center gap-1">
                                <i class="ph-bold ph-translate text-xl"></i> Traducir
                            </button>
                        </div>
                    </div>
                    <button onclick="siguienteLectura()" class="mx-auto text-sm font-semibold text-rose-500 active:scale-95 transition-all">Siguiente texto ➔</button>
                </div>

                <!-- 4. SECCIÓN DICTADO -->
                <div id="view-dictado" class="app-view hidden flex-col gap-6 w-full animate-fade-in">
                    <div class="text-center px-4">
                        <h2 class="text-xl font-bold text-stone-900 mb-1">Dictado al oído</h2>
                        <p class="text-xs text-stone-500">Escucha atentamente y escribe en coreano.</p>
                    </div>

                    <div class="bg-white p-6 rounded-[32px] shadow-sm border border-stone-100 text-center">
                        <button onclick="reproducirDictado()" class="w-20 h-20 bg-rose-50 rounded-full flex items-center justify-center mx-auto mb-6 text-rose-500 hover:bg-rose-100 active:scale-90 transition-all shadow-inner border border-rose-100">
                            <i class="ph-fill ph-headphones text-4xl"></i>
                        </button>
                        
                        <input type="text" id="dictado-input" placeholder="Escribe aquí en coreano..." class="w-full text-center px-5 py-4 rounded-2xl bg-stone-50 border-2 border-stone-100 text-lg font-medium focus:outline-none focus:border-rose-300 transition-colors mb-4" autocomplete="off" autocorrect="off" spellcheck="false">
                        
                        <div id="dictado-feedback" class="h-6 text-sm font-bold mb-4 opacity-0 transition-opacity"></div>

                        <button onclick="verificarDictado()" class="w-full bg-stone-900 text-white py-4 rounded-2xl text-sm font-semibold active:scale-95 transition-all shadow-sm">
                            Comprobar Respuesta
                        </button>
                    </div>
                </div>

                <!-- Botón de logout (al final de todas las vistas) -->
                <div class="text-center mt-4">
                    <button id="btn-logout" class="text-xs font-bold text-stone-400 hover:text-rose-500 transition-colors">Cerrar Sesión</button>
                </div>

            </div>
        </div>
    </main>

    <!-- Bottom Navigation Bar (Fija abajo) -->
    <nav id="bottom-nav" class="hidden bg-white border-t border-stone-200/60 pb-safe shrink-0 z-50 shadow-[0_-10px_40px_rgba(0,0,0,0.03)] rounded-t-[32px]">
        <div class="max-w-md mx-auto w-full px-6 py-4 flex justify-between items-center">
            
            <button onclick="cambiarVista('vocab')" class="nav-btn flex flex-col items-center gap-1 active:scale-90 transition-all text-rose-500" data-target="view-vocab">
                <i class="ph-fill ph-cards text-2xl"></i>
                <span class="text-[9px] font-bold tracking-wide">Tarjetas</span>
            </button>
            
            <button onclick="cambiarVista('memo')" class="nav-btn flex flex-col items-center gap-1 active:scale-90 transition-all text-stone-400 hover:text-stone-900" data-target="view-memo">
                <i class="ph-fill ph-puzzle-piece text-2xl"></i>
                <span class="text-[9px] font-bold tracking-wide">Juego</span>
            </button>
            
            <button onclick="cambiarVista('lectura')" class="nav-btn flex flex-col items-center gap-1 active:scale-90 transition-all text-stone-400 hover:text-stone-900" data-target="view-lectura">
                <i class="ph-fill ph-book-open-text text-2xl"></i>
                <span class="text-[9px] font-bold tracking-wide">Lectura</span>
            </button>
            
            <button onclick="cambiarVista('dictado')" class="nav-btn flex flex-col items-center gap-1 active:scale-90 transition-all text-stone-400 hover:text-stone-900" data-target="view-dictado">
                <i class="ph-fill ph-pencil-simple text-2xl"></i>
                <span class="text-[9px] font-bold tracking-wide">Dictado</span>
            </button>
            
        </div>
    </nav>

    <!-- ========================================== -->
    <!-- LOGICA DE LA APLICACIÓN (JAVASCRIPT)       -->
    <!-- ========================================== -->
    <script>
        // --- 1. CONFIGURACIÓN DE SUPABASE ---
        const SUPABASE_URL = 'https://gkunigyqgetqvjsovzjy.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdrdW5pZ3lxZ2V0cXZqc292emp5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNjc1MzEsImV4cCI6MjEwMDk0MzUzMX0.Co8JkEWVJGlexJGG5WJbnLPb63pYvdX-y5HfYTd6fsg';
        const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- 2. CONTENIDOS CREADOS POR EL EXPERTO (NIVELES) ---
        // Aquí puedes agregar Nivel 3, 4, etc., siguiendo esta misma estructura.
        const contenidoApp = {
            1: { // NIVEL 1: BÁSICO (Saludos y cosas esenciales)
                vocabulario: [
                    { coreano: "안녕하세요", espanol: "Hola / Buenos días" },
                    { coreano: "감사합니다", espanol: "Gracias (formal)" },
                    { coreano: "네", espanol: "Sí" },
                    { coreano: "아니요", espanol: "No" },
                    { coreano: "사랑해요", espanol: "Te amo (formal)" },
                    { coreano: "미안해요", espanol: "Lo siento" },
                    { coreano: "이름", espanol: "Nombre" },
                    { coreano: "사람", espanol: "Persona" }
                ],
                lecturas: [
                    { coreano: "안녕하세요! 제 이름은 안나입니다. 만나서 반갑습니다.", espanol: "¡Hola! Mi nombre es Anna. Encantado/a de conocerte." },
                    { coreano: "저는 멕시코 사람입니다. 한국어를 공부합니다.", espanol: "Soy mexicano/a. Estudio coreano." }
                ],
                dictados: ["안녕하세요", "네", "아니요", "감사합니다"] // Palabras fáciles de teclear al inicio
            },
            2: { // NIVEL 2: INTERMEDIO (Comida y lugares)
                vocabulario: [
                    { coreano: "물", espanol: "Agua" },
                    { coreano: "밥", espanol: "Arroz / Comida" },
                    { coreano: "맛있어요", espanol: "Está delicioso" },
                    { coreano: "학교", espanol: "Escuela" },
                    { coreano: "집", espanol: "Casa" },
                    { coreano: "친구", espanol: "Amigo/a" },
                    { coreano: "가다", espanol: "Ir" },
                    { coreano: "먹다", espanol: "Comer" }
                ],
                lecturas: [
                    { coreano: "오늘 친구하고 같이 밥을 먹어요. 아주 맛있어요!", espanol: "Hoy como comida junto con un amigo. ¡Está muy delicioso!" },
                    { coreano: "내일 학교에 가요. 한국어 선생님이 좋아요.", espanol: "Mañana voy a la escuela. El profesor de coreano es bueno." }
                ],
                dictados: ["물", "집", "친구", "학교", "밥"]
            }
        };

        // --- 3. ESTADO DE LA APP ---
        let nivelActual = 1;
        let indiceVocab = 0;
        let indiceLectura = 0;
        let palabraDictadoActual = "";

        // --- 4. INICIALIZACIÓN ---
        document.addEventListener('DOMContentLoaded', () => {
            verificarSesion();
            
            // Asignar eventos Auth
            document.getElementById('btn-signup').addEventListener('click', handleSignup);
            document.getElementById('btn-login').addEventListener('click', handleLogin);
            document.getElementById('btn-logout').addEventListener('click', cerrarSesion);
            
            // Evento cambio de nivel
            document.getElementById('level-selector').addEventListener('change', (e) => {
                nivelActual = parseInt(e.target.value);
                reiniciarContenidos();
            });
        });

        // --- 5. LÓGICA DE AUTENTICACIÓN (SUPABASE) ---
        async function handleSignup() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            if(!email || !password) return alert('Ingresa correo y contraseña.');
            
            const btn = document.getElementById('btn-signup');
            btn.innerText = "Cargando...";
            const { data, error } = await _supabase.auth.signUp({ email, password });
            btn.innerText = "Crear cuenta nueva";
            
            if (error) alert('Error: ' + error.message);
            else alert('¡Registro exitoso! Ya puedes iniciar sesión.');
        }

        async function handleLogin() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            if(!email || !password) return alert('Ingresa correo y contraseña.');
            
            const btn = document.getElementById('btn-login');
            btn.innerText = "Cargando...";
            const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
            btn.innerText = "Iniciar Sesión";

            if (error) alert('Error: Verifica tus datos.');
            else verificarSesion();
        }

        async function verificarSesion() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) {
                // UI: Ocultar login, mostrar app
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('app-section').classList.remove('hidden');
                document.getElementById('bottom-nav').classList.remove('hidden');
                document.getElementById('level-selector').classList.remove('hidden');
                document.getElementById('app-section').classList.add('flex');
                
                // Nombre de usuario bonito
                const nombreUsuario = session.user.email.split('@')[0];
                document.getElementById('user-info').innerText = `¡Hola, ${nombreUsuario}! ✨`;
                
                reiniciarContenidos(); // Carga el nivel actual
            }
        }

        async function cerrarSesion() {
            await _supabase.auth.signOut();
            location.reload();
        }

        // --- 6. NAVEGACIÓN Y SISTEMA DE NIVELES ---
        function cambiarVista(vistaId) {
            // Ocultar todas las vistas
            document.querySelectorAll('.app-view').forEach(el => el.classList.add('hidden', 'flex'));
            document.querySelectorAll('.app-view').forEach(el => el.classList.remove('flex'));
            
            // Mostrar la seleccionada
            document.getElementById(`view-${vistaId}`).classList.remove('hidden');
            document.getElementById(`view-${vistaId}`).classList.add('flex');
            
            // Actualizar diseño de botones de navegación (poner gris los inactivos, rosa el activo)
            document.querySelectorAll('.nav-btn').forEach(btn => {
                if(btn.dataset.target === `view-${vistaId}`) {
                    btn.classList.remove('text-stone-400');
                    btn.classList.add('text-rose-500');
                    btn.querySelector('i').classList.replace('ph', 'ph-fill'); // Icono relleno
                } else {
                    btn.classList.remove('text-rose-500');
                    btn.classList.add('text-stone-400');
                }
            });

            // Acciones específicas al entrar a una vista
            if(vistaId === 'memo') iniciarMemorama();
            if(vistaId === 'dictado') resetDictadoUI();
        }

        function reiniciarContenidos() {
            indiceVocab = 0;
            indiceLectura = 0;
            cargarVocabularioUI();
            cargarLecturaUI();
            resetDictadoUI();
            iniciarMemorama();
        }

        // --- 7. MÓDULO: VOCABULARIO (Tarjetas) ---
        function cargarVocabularioUI() {
            const lista = contenidoApp[nivelActual].vocabulario;
            const item = lista[indiceVocab];
            
            const textoCoreano = document.getElementById('palabra-coreano');
            textoCoreano.style.opacity = 0;
            setTimeout(() => {
                textoCoreano.innerText = item.coreano;
                document.getElementById('palabra-espanol').innerText = item.espanol;
                textoCoreano.style.opacity = 1;
            }, 150);
        }

        function siguienteVocabulario() {
            const lista = contenidoApp[nivelActual].vocabulario;
            indiceVocab = (indiceVocab + 1) % lista.length;
            cargarVocabularioUI();
        }

        // --- 8. MÓDULO: MEMORAMA (Gamificación) ---
        let cartasVolteadas = [];
        let bloqueado = false;
        let paresEncontrados = 0;

        function iniciarMemorama() {
            const grid = document.getElementById('memo-grid');
            grid.innerHTML = ''; // Limpiar mesa
            cartasVolteadas = [];
            bloqueado = false;
            paresEncontrados = 0;

            // Tomar 6 palabras al azar del nivel actual
            let palabras = [...contenidoApp[nivelActual].vocabulario].sort(() => 0.5 - Math.random()).slice(0, 6);
            
            // Crear el mazo (12 cartas: 6 en coreano, 6 en español)
            let mazo = [];
            palabras.forEach(p => {
                mazo.push({ texto: p.coreano, tipo: 'kr', id: p.coreano });
                mazo.push({ texto: p.espanol, tipo: 'es', id: p.coreano });
            });

            // Revolver mazo
            mazo.sort(() => 0.5 - Math.random());

            // Renderizar cartas
            mazo.forEach((carta, index) => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card perspective h-24 w-full cursor-pointer rounded-2xl';
                cardEl.dataset.id = carta.id;
                cardEl.dataset.tipo = carta.tipo;
                
                cardEl.innerHTML = `
                    <div class="card-inner w-full h-full relative transform-style-3d">
                        <!-- Frente (Dorso de la carta) -->
                        <div class="backface-hidden absolute w-full h-full bg-rose-100 rounded-2xl border-2 border-rose-200 flex items-center justify-center text-rose-300 text-2xl shadow-sm">
                            <i class="ph-fill ph-flower-lotus"></i>
                        </div>
                        <!-- Reverso (Contenido) -->
                        <div class="backface-hidden rotate-y-180 absolute w-full h-full bg-white rounded-2xl border-2 border-stone-100 flex items-center justify-center p-2 text-center shadow-sm">
                            <span class="font-bold ${carta.tipo === 'kr' ? 'text-lg text-stone-900' : 'text-xs text-stone-500'}">${carta.texto}</span>
                        </div>
                    </div>
                `;
                
                cardEl.addEventListener('click', () => voltearCarta(cardEl));
                grid.appendChild(cardEl);
            });
        }

        function voltearCarta(carta) {
            if (bloqueado || carta.classList.contains('flipped') || carta.classList.contains('matched')) return;

            carta.classList.add('flipped');
            if(carta.dataset.tipo === 'kr') reproducirVoz(carta.querySelector('span').innerText);

            cartasVolteadas.push(carta);

            if (cartasVolteadas.length === 2) {
                bloqueado = true;
                verificarPar();
            }
        }

        function verificarPar() {
            const [c1, c2] = cartasVolteadas;
            const hacenMatch = c1.dataset.id === c2.dataset.id;

            if (hacenMatch) {
                c1.classList.add('matched');
                c2.classList.add('matched');
                paresEncontrados++;
                if(paresEncontrados === 6) setTimeout(() => alert("¡Ganaste! ✨ Qué buena memoria."), 500);
                resetearTurno();
            } else {
                setTimeout(() => {
                    c1.classList.remove('flipped');
                    c2.classList.remove('flipped');
                    resetearTurno();
                }, 1000);
            }
        }

        function resetearTurno() {
            cartasVolteadas = [];
            bloqueado = false;
        }

        // --- 9. MÓDULO: LECTURA ---
        function cargarLecturaUI() {
            const lista = contenidoApp[nivelActual].lecturas;
            const item = lista[indiceLectura];
            document.getElementById('lectura-coreano').innerText = item.coreano;
            document.getElementById('lectura-traduccion').innerText = item.espanol;
            document.getElementById('lectura-traduccion').classList.add('hidden'); // Ocultar por defecto
        }

        function siguienteLectura() {
            const lista = contenidoApp[nivelActual].lecturas;
            indiceLectura = (indiceLectura + 1) % lista.length;
            cargarLecturaUI();
        }

        function toggleTraduccion() {
            document.getElementById('lectura-traduccion').classList.toggle('hidden');
        }

        // --- 10. MÓDULO: DICTADO ---
        function resetDictadoUI() {
            const lista = contenidoApp[nivelActual].dictados;
            // Seleccionar una palabra al azar del nivel
            palabraDictadoActual = lista[Math.floor(Math.random() * lista.length)];
            
            document.getElementById('dictado-input').value = '';
            document.getElementById('dictado-feedback').style.opacity = 0;
        }

        function reproducirDictado() {
            reproducirVoz(palabraDictadoActual, 0.75); // Lento para que entiendan
        }

        function verificarDictado() {
            const input = document.getElementById('dictado-input').value.trim();
            const feedback = document.getElementById('dictado-feedback');
            
            if(!input) return;

            feedback.style.opacity = 1;
            if(input === palabraDictadoActual) {
                feedback.innerText = "¡Perfecto! ✨";
                feedback.className = "h-6 text-sm font-bold mb-4 transition-opacity text-emerald-500";
                reproducirVoz("딩동댕"); // Sonido de correcto en corea (Ding dong dang)
                setTimeout(resetDictadoUI, 1500); // Siguiente palabra auto
            } else {
                feedback.innerText = `Casi... Era: ${palabraDictadoActual}`;
                feedback.className = "h-6 text-sm font-bold mb-4 transition-opacity text-rose-500";
            }
        }

        // --- 11. MOTOR DE AUDIO (Web Speech API) ---
        function reproducirVoz(texto, velocidad = 0.85) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const pronunciacion = new SpeechSynthesisUtterance();
                pronunciacion.text = texto;
                pronunciacion.lang = 'ko-KR'; 
                pronunciacion.rate = velocidad; 
                window.speechSynthesis.speak(pronunciacion);
            } else {
                alert("Tu navegador no soporta voz. Intenta en Chrome o Safari.");
            }
        }
    </script>
</body>
</html>
